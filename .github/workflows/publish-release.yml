name: Publish validated Release
on:
  push:
    tags:
      - "v0.2.0"
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-tmsgpicker-v0.2.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release, create tag, and publish existing draft
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const intent = JSON.parse(fs.readFileSync('scripts/publish-intent.json','utf8'));
            const {owner, repo} = context.repo;
            const {tag, commit, release_id: releaseId} = intent;
            if (tag !== 'v0.2.0' || commit !== '229fd56cc630ea1092eea12e633a81b9311553f0' || releaseId !== 415631369)
              throw new Error('Unexpected release intent. Manual review required for new versions.');
            if (context.ref !== 'refs/tags/' + tag) throw new Error('Publish only by a manually pushed matching version tag.');
            const built = await github.rest.actions.getWorkflowRun({
              owner,repo,run_id:39006433438
            });
            if (built.data.conclusion !== 'success') throw new Error('Release build did not pass.');
            const published = await github.rest.repos.getRelease({owner,repo,release_id:releaseId});
            const release = published.data;
            const required = [
              'TMsgPicker-Setup-x64.exe',
              'TMsgPicker-Portable-x64.zip',
              'TMsgPicker-Windows-x64-Artifacts.zip',
              'native-dependencies.json',
              'SHA256SUMS.txt'
            ];
            if (release.tag_name !== tag || release.target_commitish !== commit)
              throw new Error('Release source/version differs from vetted build.');
            if (!required.every(name => release.assets.some(a => a.name === name && a.state === 'uploaded' && a.size > 0)))
              throw new Error('Required Release Assets missing or incomplete.');
            const matches = await github.paginate(github.rest.repos.listReleases,{owner,repo,per_page:100});
            if (matches.filter(r=>r.tag_name===tag).length!==1)
              throw new Error('Duplicate Release for this tag.');
            const ref = (await github.rest.git.getRef({owner,repo,ref:'tags/'+tag})).data;
            let actual=ref.object.sha;
            if(ref.object.type==='tag'){
              const t=await github.rest.git.getTag({owner,repo,tag_sha:actual});
              actual=t.data.object.sha;
            }
            if(actual!==commit)throw new Error('Tag points at a DIFFERENT commit. Do not move tags.');

            if(release.draft){
              await github.rest.repos.updateRelease({
                owner,repo,release_id:releaseId,
                name:'TMsgPicker v0.2.0',
                draft:false,prerelease:false,make_latest:'true',
                body:release.body.replace(/\*\*Draft — human clean-machine acceptance still required\*\* before publishing\./g,
                  '**Release validated on Windows x64 by the maintainer.**')
              });
              core.info('Published existing release '+releaseId);
            }else{
              core.info('Release was already published; no duplicate created.');
            }
