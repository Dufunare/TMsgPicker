name: Windows x64 Release

on:
  pull_request:
    paths:
      - "scripts/**"
      - "docs/assets/**"
      - ".github/workflows/release.yml"
      - "src-tauri/build.rs"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:
  push:
    # A release-intent change on main starts the tested release pipeline.
    # Tag pushes remain supported, e.g. for legacy/manual releases.
    branches:
      - main
    paths:
      - "scripts/release-intent.json"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-scripts:
    name: Validate pinned dependencies and PowerShell syntax
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse release scripts without executing them
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('build-tdlib', 'stage-native', 'audit-pe-imports', 'package-release')
          foreach ($name in $names) {
            $path = Join-Path $PWD "scripts/$name.ps1"
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $name, $_) }
              throw "PowerShell syntax invalid: $name"
            }
          }
          $versions = Get-Content scripts/native-versions.json -Raw | ConvertFrom-Json
          if ($versions.tdlib.version -ne '1.8.68' -or
              $versions.tdlib.commit -ne 'f381f4b35ebfd52a086ec3af5352ed77bbdbde01') {
            throw 'TDLib dependency baseline changed unexpectedly; update documentation and review.'
          }
          if (-not (Test-Path docs/assets/tmsgpicker-icon.svg)) {
            throw 'Canonical TMsgPicker icon missing.'
          }
          $intent = Get-Content scripts/release-intent.json -Raw | ConvertFrom-Json
          if ($intent.tag -cne "v$($intent.version)") {
            throw 'Release intent tag and version mismatch.'
          }
      - name: Offline release staging and integrity regression (synthetic files)
        run: ./tests/releaseStaging.ps1

  build:
    name: Build and inspect Windows x64 assets
    if: github.event_name != 'pull_request'
    needs: validate-scripts
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.target.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        # This job may commit the deterministically generated icon files to main.
        with:
          persist-credentials: true
      - name: Check tag, package versions and explicit release intent
        id: version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npmVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($npmVersion -cne $version) {
            throw "package.json version $npmVersion != app version $version"
          }
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoMatch = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $cargoMatch.Success -or $cargoMatch.Groups[1].Value -cne $version) {
            throw 'Cargo.toml package version differs from app version.'
          }
          $tag = "v$version"
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF_NAME -cne $tag) {
            throw "Tag $env:RELEASE_REF_NAME must match app version $tag"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:RELEASE_REF_TYPE -eq 'branch') {
            if ($env:RELEASE_REF_NAME -cne 'main') {
              throw 'Branch-based release is restricted to main.'
            }
            $intent = Get-Content scripts/release-intent.json -Raw | ConvertFrom-Json
            if ($intent.tag -cne $tag -or $intent.version -cne $version) {
              throw "Release intent mismatch: expected $tag"
            }
            $existing = @(git ls-remote --tags origin "refs/tags/$tag")
            if ($existing.Count -gt 0) {
              throw "Release tag $tag already exists; refusing to retag."
            }
          }
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm.cmd install --frozen-lockfile
      - name: Generate complete Tauri icon set from canonical SVG
        run: pnpm.cmd tauri icon docs/assets/tmsgpicker-icon.svg --output src-tauri/icons
      - name: Check generated icons into main before tagging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src-tauri/icons
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -gt 0) {
            git commit -m "build(icons): sync Tauri icon set for v0.2.0"
            if ($LASTEXITCODE -ne 0) { throw 'Generated icon commit failed.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Could not sync generated icons to main; no release may be tagged.' }
          }
      - name: Record exact source commit used for release
        id: target
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if (-not ($sha -match '^[0-9a-f]{40}$')) { throw 'Invalid source SHA' }
          "release_sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Frontend tests
        run: pnpm.cmd test
      - name: Frontend typecheck and production build
        run: pnpm.cmd build
      - name: Rust core and mock tests (no TDLib required)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --tests
      - name: Rust core Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-2022-${{ hashFiles('scripts/native-versions.json') }}
      - name: Build pinned TDLib, OpenSSL, zlib and gperf
        run: ./scripts/build-tdlib.ps1 -Jobs 2
      - name: Stage verified runtime DLLs, license notices and NSIS config
        run: ./scripts/stage-native.ps1
      - name: Build NSIS installer with runtime dependencies
        env:
          TMSGPICKER_TDLIB_DIR: ${{ github.workspace }}\native\tdlib
        run: pnpm.cmd tauri build --bundles nsis --config src-tauri/tauri.release.generated.json
      - name: Smoke test pinned TDLib ABI (no account or Session)
        env:
          TMSGPICKER_TDLIB_DIR: ${{ github.workspace }}\native\tdlib
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin tdlib_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Could not build TDLib smoke test' }
          $output = (& ./src-tauri/target/release/tdlib_smoke.exe | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "TDLib ABI smoke test failed: $output" }
          $expected = (Get-Content scripts/native-versions.json -Raw | ConvertFrom-Json).tdlib.version
          if (-not $output.Contains($expected)) { throw "TDLib reported unexpected version: $output" }
          Write-Host $output
      - name: Inspect installer and produce audited portable ZIP + SHA256SUMS
        run: ./scripts/package-release.ps1
      - name: Bundle GitHub Actions artifacts as an additional Release Asset
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'native\dist'
          $manifest = Join-Path $PWD 'native\release\licenses\native-dependencies.json'
          $standaloneManifest = Join-Path $dist 'native-dependencies.json'
          Copy-Item -LiteralPath $manifest -Destination $standaloneManifest -Force
          $bundle = Join-Path $dist 'TMsgPicker-Windows-x64-Artifacts.zip'
          $members = @(
            (Join-Path $dist 'TMsgPicker-Setup-x64.exe'),
            (Join-Path $dist 'TMsgPicker-Portable-x64.zip'),
            $standaloneManifest
          )
          Compress-Archive -LiteralPath $members -DestinationPath $bundle -CompressionLevel Optimal -Force
          $lines = @()
          foreach ($file in @($standaloneManifest, $bundle)) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          [System.IO.File]::AppendAllText(
            (Join-Path $dist 'SHA256SUMS.txt'),
            ($lines -join [Environment]::NewLine) + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@v4
        with:
          name: tmsgpicker-windows-x64
          path: |
            native/dist/TMsgPicker-Setup-x64.exe
            native/dist/TMsgPicker-Portable-x64.zip
            native/dist/TMsgPicker-Windows-x64-Artifacts.zip
            native/dist/native-dependencies.json
            native/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Attach validated build and artifact bundle to draft Release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tmsgpicker-windows-x64
          path: artifacts
      - name: Ensure annotated tag points at the verified build commit
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag) || !/^[a-f0-9]{40}$/.test(sha)) {
              throw new Error('Invalid audited release version or commit SHA');
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const existingRelease = releases.find(r => r.tag_name === tag);
            if (existingRelease && !existingRelease.draft) {
              throw new Error(tag + ' is already published; never recreate or downgrade a public Release');
            }
            let ref;
            try {
              ref = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (ref) {
              let actual = ref.object.sha;
              if (ref.object.type === 'tag') {
                const annotated = await github.rest.git.getTag({owner, repo, tag_sha:actual});
                actual = annotated.data.object.sha;
              }
              if (actual !== sha) throw new Error(tag + ' already exists at a DIFFERENT commit; refusing to move it');
              core.info('Verified existing immutable tag ' + tag + ' -> ' + sha);
            } else {
              const created = await github.rest.git.createTag({
                owner, repo, tag,
                message: 'TMsgPicker ' + tag + ' (audited Windows x64 build)',
                object: sha, type: 'commit'
              });
              await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha:created.data.sha});
              core.info('Created annotated Git tag ' + tag + ' -> ' + sha);
            }
      - name: Attach validated build to draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ needs.build.outputs.release_sha }}
          name: TMsgPicker ${{ needs.build.outputs.release_tag }} — Windows x64 Preview
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            artifacts/TMsgPicker-Setup-x64.exe
            artifacts/TMsgPicker-Portable-x64.zip
            artifacts/TMsgPicker-Windows-x64-Artifacts.zip
            artifacts/native-dependencies.json
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            ## TMsgPicker v0.2.0 — Windows x64 preview

            QR login, refreshed app icon and documentation, and a downloadable full CI artifacts bundle.

            - `TMsgPicker-Setup-x64.exe`: NSIS installer
            - `TMsgPicker-Portable-x64.zip`: portable app and runtime libraries
            - `TMsgPicker-Windows-x64-Artifacts.zip`: combined build artifacts for convenient retrieval
            - `native-dependencies.json`: exact native dependency provenance
            - `SHA256SUMS.txt`: SHA-256 for all four distributable assets

            This application **does not embed Telegram API credentials**.
            Configure your own API ID and Hash in Application Settings.

            **Draft — human clean-machine acceptance still required** before publishing.
            Review `docs/RELEASE.md` for upgrade/session retention, WebView2,
            DLL loading, licenses, security, and missing code signing.
