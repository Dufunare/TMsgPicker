name: Frontend UI
on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-ui.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  rust-offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust core, services and mock regression
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --tests
      - name: Rust core static checks
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
